    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&family=Jost:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var isExt = function (s) {
          return typeof s === 'string' && (s.indexOf('chrome-extension://') !== -1 || s.indexOf('moz-extension://') !== -1);
        };
        window.addEventListener(
          'error',
          function (e) {
            var stack = e.error && typeof e.error.stack === 'string' ? e.error.stack : '';
            var msg = typeof e.message === 'string' ? e.message : '';
            if (isExt(e.filename) || isExt(stack) || msg.indexOf('Cannot set property fetch of #<Window>') !== -1) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (e) {
            var r = e.reason;
            var stack = r && typeof r.stack === 'string' ? r.stack : '';
            var msg = r && typeof r.message === 'string' ? r.message : String(r || '');
            if (
              isExt(stack) ||
              msg.indexOf('MetaMask') !== -1 ||
              stack.indexOf('@vite/client') !== -1 ||
              msg.indexOf('WebSocket closed without opened.') !== -1
            ) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
